[package]
name = "overhue-solver"
version = "0.1.0"
edition = "2021"
description = "Dev-only Rust solver/generator for Overhue levels. Reads/writes the same JSON schema as ../export-levels.js; never shipped to the browser."

[[bin]]
name = "solve"
path = "src/bin/solve.rs"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = 3
